# 한국어 설문지. 선택형 응답은 선택지 문자열과 정확히 일치해야 합니다.
questions:
  - id: Q1
    text: "요즘 전반적으로 자신의 삶에 얼마나 만족하십니까? (1=전혀 만족하지 않음, 5=매우 만족함)"
    type: scale
    minimum: 1
    maximum: 5
  - id: Q2
    text: "현재 대한민국에서 가장 우선적으로 다뤄야 할 정책 분야는 무엇이라고 생각하십니까?"
    type: single
    options: ["경제/일자리", "보건의료", "교육", "국가안보", "기후/환경", "부패방지/청렴"]
  - id: Q3
    text: "지난 12개월 동안 해외여행을 몇 번 다녀오셨습니까?"
    type: single
    options: ["0회", "1~2회", "3~4회", "5회 이상"]
  - id: Q4
    text: "공공서비스 재원을 마련하기 위해 고소득층에 대한 세금을 인상하는 것에 찬성하십니까?"
    type: single
    options: ["매우 반대", "반대", "중립/잘 모르겠음", "찬성", "매우 찬성"]
  - id: Q5
    text: "앞으로 1년 동안 가장 걱정되는 일을 짧은 한 문장으로 적어 주세요."
    type: free
